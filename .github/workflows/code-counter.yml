name: Update code counter

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/update_code_counter.py'
      - 'scripts/render_profile_animation.py'
      - 'scripts/build_profile_motion.py'
      - 'scripts/animation-requirements.txt'
      - 'tests/test_code_counter.py'
      - 'tests/test_profile_animation.py'
      - 'tests/test_profile_motion.py'
      - '.github/workflows/code-counter.yml'
      - 'assets/profile/about/**'
      - 'assets/profile/headings/**'
      - 'assets/profile/projects/**'
      - 'assets/profile/stack/**'
      - 'assets/profile/study/**'
      - 'assets/profile/contacts/**'
      - 'assets/profile/animation/**'
      - 'assets/profile/fonts/**'

permissions:
  contents: write

concurrency:
  group: profile-code-counter
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Kriksson/Kriksson'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install animation renderer
        run: python3 -m pip install -r scripts/animation-requirements.txt

      - name: Build animated profile assets
        run: python3 scripts/build_profile_motion.py

      - name: Verify counter and animation logic
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check metrics token
        env:
          PROFILE_METRICS_TOKEN: ${{ secrets.PROFILE_METRICS_TOKEN }}
        run: |
          if [ -z "$PROFILE_METRICS_TOKEN" ]; then
            echo "::error::Add PROFILE_METRICS_TOKEN with repo and read:user permissions."
            exit 1
          fi

      - name: Read aggregate account statistics
        env:
          GH_TOKEN: ${{ secrets.PROFILE_METRICS_TOKEN }}
        run: python3 scripts/update_code_counter.py --username Kriksson

      - name: Render typing animation with current totals
        run: python3 scripts/render_profile_animation.py

      - name: Commit changed statistics
        run: |
          git add -- README.md assets/profile/motion assets/profile/stats/code-counter.gif assets/profile/stats/code-counter-mobile.gif assets/profile/stats/code-counter.png assets/profile/stats/code-counter-mobile.png metrics/code-stats.json
          if git diff --cached --quiet; then
            echo 'No code statistics changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh aggregate code statistics'
          git push origin HEAD:main
