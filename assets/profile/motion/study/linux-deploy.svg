<svg xmlns="http://www.w3.org/2000/svg" width="110" height="28" viewBox="0 0 110 28" role="img" aria-labelledby="title description">
  <title id="title">Linux Deploy</title><desc id="description">Linux Deploy in a quiet graphite terminal palette with mint signal accents.</desc>
  <defs><pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M12 0H0V12" fill="none" stroke="#354a42" stroke-width=".8"/></pattern></defs>
