<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="256" viewBox="0 0 1120 256" role="img" aria-label="ItemBro — Площадка для игровых предметов и цифровых услуг. Заказы, внутренний баланс, отзывы и чат."><defs><clipPath id="motion-frame"><rect x="1.0" y="1.0" width="1118.0" height="254.0" rx="14" /></clipPath><clipPath id="motion-belt"><rect x="24.0" y="243.0" width="1072.0" height="7" rx="1" /></clipPath><linearGradient id="motion-sheen" x1="0" y1="0" x2="1" y2=".2"><stop offset="0" stop-color="#e2c6a4" stop-opacity="0" /><stop offset=".46" stop-color="#e2c6a4" stop-opacity="0" /><stop offset=".5" stop-color="#e2c6a4" stop-opacity=".11" /><stop offset=".54" stop-color="#e2c6a4" stop-opacity="0" /><stop offset="1" stop-color="#e2c6a4" stop-opacity="0" /></linearGradient></defs><style>
