<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256" role="img" aria-label="MCSkill Helper — Инструменты модератора для Minecraft. Проверка чанков, лимитов блоков и домов игроков."><defs><clipPath id="motion-frame"><rect x="1.0" y="1.0" width="638.0" height="254.0" rx="14" /></clipPath><clipPath id="motion-belt"><rect x="24.0" y="243.0" width="592.0" height="7" rx="1" /></clipPath><linearGradient id="motion-sheen" x1="0" y1="0" x2="1" y2=".2"><stop offset="0" stop-color="#e2c6a4" stop-opacity="0" /><stop offset=".46" stop-color="#e2c6a4" stop-opacity="0" /><stop offset=".5" stop-color="#e2c6a4" stop-opacity=".11" /><stop offset=".54" stop-color="#e2c6a4" stop-opacity="0" /><stop offset="1" stop-color="#e2c6a4" stop-opacity="0" /></linearGradient></defs><style>
@keyframes profile-belt { to { transform: translateX(32px); } }
@keyframes profile-sheen { to { transform: translateX(1920px); } }
@keyframes profile-gear { to { transform: rotate(360deg); } }
@keyframes profile-signal { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
.profile-conveyor { animation: profile-belt 1.6s linear infinite; }
.profile-sheen { animation: profile-sheen 9s linear infinite; animation-delay: -7.1s; }
.profile-gear { transform-origin: 0px 0px; animation: profile-gear 24s linear infinite; }
.profile-signal { animation: profile-signal 6s cubic-bezier(.77,0,.175,1) infinite; animation-delay: -7.1s; }
@media (prefers-reduced-motion: reduce) {
 .profile-conveyor, .profile-sheen, .profile-gear, .profile-signal { animation: none; }
 .profile-sheen { opacity: 0; }
}
