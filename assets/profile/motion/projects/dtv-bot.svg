  <style>
    .project-tracer { stroke-dasharray: 10 1200; stroke-dashoffset: 1200; opacity: .9; animation: project-trace 4.8s cubic-bezier(.22,.61,.36,1) .2s 1 both; }
    .project-node { transform-box: fill-box; transform-origin: center; animation: project-pulse 1.8s cubic-bezier(.2,.7,.25,1) 1 both; }
    .project-node:nth-of-type(2n) { animation-delay: .12s; }
    @keyframes project-trace { to { stroke-dashoffset: 0; opacity: .25; } }
    @keyframes project-pulse { 0% { transform: scale(.82); opacity: .62; } 36% { transform: scale(1.42); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .project-tracer, .project-node { animation: none; } }
  </style>

