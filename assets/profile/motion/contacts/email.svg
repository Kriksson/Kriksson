<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56" role="img" aria-label="Email k.kriksson@gmail.com"><defs><clipPath id="motion-frame"><rect x="1.0" y="1.0" width="54.0" height="54.0" rx="5" /></clipPath><clipPath id="motion-belt"><rect x="7.0" y="52.0" width="42.0" height="2" rx="1" /></clipPath><linearGradient id="motion-sheen" x1="0" y1="0" x2="1" y2=".2"><stop offset="0" stop-color="#e2c6a4" stop-opacity="0" /><stop offset=".46" stop-color="#e2c6a4" stop-opacity="0" /><stop offset=".5" stop-color="#e2c6a4" stop-opacity=".11" /><stop offset=".54" stop-color="#e2c6a4" stop-opacity="0" /><stop offset="1" stop-color="#e2c6a4" stop-opacity="0" /></linearGradient></defs><style>
@keyframes profile-belt { to { transform: translateX(32px); } }
@keyframes profile-sheen { to { transform: translateX(168px); } }
@keyframes profile-gear { to { transform: rotate(360deg); } }
@keyframes profile-signal { 0%,100% { opacity: .35; } 50% { opacity: .85; } }
.profile-conveyor { animation: profile-belt 1.6s linear infinite; }
