<svg xmlns="http://www.w3.org/2000/svg" width="640" height="84" viewBox="0 0 640 84" role="img" aria-labelledby="title description">
  <title id="title">Сборка</title><desc id="description">Сборка in a quiet graphite terminal palette with mint signal accents.</desc>
